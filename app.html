<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payton App | Recibos e contas</title>
<meta name="theme-color" content="#5338F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Figtree:wght@400;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#12172B; --muted:#4A5170;
  --brand:#5338F0; --on-brand:#FFFFFF; --mint:#38D69A; --on-mint:#0B2A1F; --line:#D8DCEB;
  --in:#0B7A52; --out:#B3261E; --tint:#E9E6FF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Courier Prime","Courier New",monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1226; --surface:#1A1E3D; --ink:#F1F3FF; --muted:#AAB0D6;
    --brand:#8C7BFF; --on-brand:#0F1226; --line:#2C3263; --in:#5BE3AE; --out:#FF8A80; --tint:#2A2B63; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1226; --surface:#1A1E3D; --ink:#F1F3FF; --muted:#AAB0D6;
  --brand:#8C7BFF; --on-brand:#0F1226; --line:#2C3263; --in:#5BE3AE; --out:#FF8A80; --tint:#2A2B63; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.5 var(--body);padding-bottom:5.5rem}
.wrap{max-width:34rem;margin:0 auto;padding:1rem 1.25rem}
.brand{display:flex;align-items:center;gap:.6rem;font:800 1.5rem var(--display)}
.brand svg{width:2.2rem;height:2.2rem}
h1{font:800 1.8rem/1.1 var(--display);margin:1.2rem 0 1rem}
h2{font:800 1.2rem var(--display);margin:1.6rem 0 .6rem}
label{display:block;font-weight:600;margin-bottom:.3rem}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:.8rem;padding:.75rem .9rem;margin-bottom:1rem}
input:focus,select:focus{border-color:var(--brand);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
button{font:600 1rem var(--body);padding:.75rem 1.2rem;border-radius:999px;border:2px solid var(--brand);background:var(--brand);color:var(--on-brand);cursor:pointer}
button.alt{background:transparent;color:var(--ink);border-color:var(--line)}
button.sm{padding:.4rem .8rem;font-size:.9rem}
button.full{width:100%}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.msg{min-height:1.4rem;color:var(--muted);font-size:.95rem;margin:.6rem 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1rem}
.stat.big{grid-column:1/-1;background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.stat small{display:block;font-size:.85rem;opacity:.8}
.stat b{font:800 1.5rem var(--display)}
.in{color:var(--in)}.out{color:var(--out)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.9rem 1rem;margin-bottom:.6rem}
.item .top{display:flex;justify-content:space-between;gap:1rem;font-weight:600}
.item .sub{color:var(--muted);font-size:.9rem;margin:.1rem 0 .5rem}
.item .acts{display:flex;gap:.5rem}
.empty{color:var(--muted);padding:.5rem 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);padding:.8rem .2rem;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:.15rem}
nav button[aria-selected="true"]{color:var(--brand);font-weight:700}
nav svg{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
#ov{position:fixed;inset:0;background:rgba(10,12,30,.72);z-index:10;overflow:auto;padding:calc(1rem + env(safe-area-inset-top,0px)) 1.25rem 2rem}
#ov .box{max-width:24rem;margin:0 auto}
#rec{background:#fff;color:#12172B;font:400 .96rem/1.7 var(--mono);padding:1.4rem 1.2rem;margin-bottom:1rem;border-top:.5rem solid var(--mint)}
#rec .tt{display:flex;align-items:center;justify-content:center;gap:.5rem;font:800 1.3rem var(--display)}
#rec .tt svg{width:1.8rem;height:1.8rem}
#rec .nn{text-align:center;font-weight:700;margin:.2rem 0 .6rem}
#rec .r{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px dashed #D8DCEB;word-break:break-word}
#rec .r span:last-child{text-align:right}
#rec .tot{display:flex;justify-content:space-between;margin-top:.7rem;font-weight:700;font-size:1.1rem}
#rec .sg{margin-top:2rem;border-top:1px solid #12172B;text-align:center;font-size:.85rem;padding-top:.3rem}
#rec .ty{text-align:center;margin-top:.8rem;font-size:.9rem;color:#4A5170}
.ovb{display:flex;gap:.6rem}.ovb button{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--brand)"/><path d="M13 31V10h9.5a6.5 6.5 0 0 1 0 13H13" fill="none" stroke="var(--on-brand)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="30" r="3.2" fill="var(--mint)"/></svg>Payton</div>

  <section id="t-res">
    <h1>Resumo</h1>
    <div class="stats">
      <div class="stat big"><small>Saldo</small><b id="s-sal">0 Kz</b></div>
      <div class="stat"><small>Recebido</small><b id="s-rec" class="in">0 Kz</b></div>
      <div class="stat"><small>Gastos</small><b id="s-des" class="out">0 Kz</b></div>
    </div>
    <h2>Últimos movimentos</h2>
    <div id="mov"></div>
    <p class="msg">Os dados ficam guardados neste telemóvel, no mesmo navegador.</p>
  </section>

  <section id="t-rec" hidden>
    <h1>Novo recibo</h1>
    <label for="cli">Nome do cliente</label><input id="cli" maxlength="40" placeholder="Ex.: Maria Silva">
    <label for="srv">Serviço feito</label><input id="srv" maxlength="60" placeholder="Ex.: Site de uma página">
    <div class="two">
      <div><label for="val">Valor (Kz)</label><input id="val" type="number" min="0" inputmode="numeric" placeholder="0"></div>
      <div><label for="pag">Pagamento</label><select id="pag"><option>Dinheiro</option><option>Transferência</option><option>Multicaixa Express</option><option>Outra</option></select></div>
    </div>
    <button class="full" id="addR" type="button">Guardar e ver recibo</button>
    <p class="msg" id="m-rec" role="status"></p>
    <h2>Recibos guardados</h2>
    <div id="l-rec"></div>
  </section>

  <section id="t-des" hidden>
    <h1>Gastos</h1>
    <label for="dd">O que foi pago</label><input id="dd" maxlength="50" placeholder="Ex.: Dados móveis">
    <label for="dv">Valor (Kz)</label><input id="dv" type="number" min="0" inputmode="numeric" placeholder="0">
    <button class="full" id="addD" type="button">Guardar gasto</button>
    <p class="msg" id="m-des" role="status"></p>
    <h2>Gastos guardados</h2>
    <div id="l-des"></div>
  </section>
</div>

<nav aria-label="Secções">
  <button type="button" data-t="res" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumo</button>
  <button type="button" data-t="rec" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Recibos</button>
  <button type="button" data-t="des" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 11h18"/></svg>Gastos</button>
</nav>

<div id="ov" hidden>
  <div class="box">
    <div id="rec">
      <div class="tt"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#5338F0"/><path d="M13 31V10h9.5a6.5 6.5 0 0 1 0 13H13" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="30" r="3.2" fill="#38D69A"/></svg>Payton</div>
      <div class="nn">RECIBO Nº <span id="v-n"></span></div>
      <div class="r"><span>Data</span><span id="v-d"></span></div>
      <div class="r"><span>Cliente</span><span id="v-c"></span></div>
      <div class="r"><span>Serviço</span><span id="v-s"></span></div>
      <div class="r"><span>Pagamento</span><span id="v-p"></span></div>
      <div class="tot"><span>TOTAL</span><span id="v-v"></span></div>
      <div class="sg">Assinatura</div>
      <div class="ty">Obrigado pela preferência!</div>
    </div>
    <div class="ovb"><button type="button" id="cp">Copiar texto</button><button type="button" class="alt" id="fc" style="color:#fff;border-color:#fff">Fechar</button></div>
    <p class="msg" id="m-ov" role="status" style="color:#fff"></p>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var S={rec:[],des:[],n:1};
  try{var raw=localStorage.getItem("payton_app");if(raw){var o=JSON.parse(raw);if(o&&o.rec&&o.des){S=o;S.n=S.n||1}}}catch(e){}
  function save(){try{localStorage.setItem("payton_app",JSON.stringify(S))}catch(e){}}
  function kz(v){try{return new Intl.NumberFormat("pt-PT",{maximumFractionDigits:0}).format(v)+" Kz"}catch(e){return v+" Kz"}}
  function hoje(){var d=new Date(),p=function(x){return String(x).padStart(2,"0")};return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
  function num(n){return String(n).padStart(3,"0")}

  var cur=null;
  function ver(r){
    cur=r;$("v-n").textContent=num(r.num);$("v-d").textContent=r.dat;$("v-c").textContent=r.cli;
    $("v-s").textContent=r.srv;$("v-p").textContent=r.pag;$("v-v").textContent=kz(r.val);
    $("m-ov").textContent="";$("ov").hidden=false;
  }
  $("fc").addEventListener("click",function(){$("ov").hidden=true});
  $("cp").addEventListener("click",function(){
    if(!cur)return;
    var t="PAYTON\nRECIBO Nº "+num(cur.num)+"\nData: "+cur.dat+"\nCliente: "+cur.cli+"\nServiço: "+cur.srv+"\nPagamento: "+cur.pag+"\nTOTAL: "+kz(cur.val)+"\nObrigado pela preferência!";
    try{navigator.clipboard.writeText(t).then(function(){$("m-ov").textContent="Copiado! Cole no WhatsApp."},function(){$("m-ov").textContent="Não foi possível copiar. Tire um print."})}
    catch(e){$("m-ov").textContent="Não foi possível copiar. Tire um print."}
  });

  function apagar(lista,id,btn){
    if(btn.dataset.c!=="1"){btn.dataset.c="1";btn.textContent="Confirmar?";setTimeout(function(){btn.dataset.c="";btn.textContent="Apagar"},3000);return}
    S[lista]=S[lista].filter(function(x){return x.id!==id});save();render();
  }
  function lista(box,arr,tipo){
    box.textContent="";
    if(!arr.length){box.appendChild(el("p","empty","Ainda não há nada guardado."));return}
    arr.slice().reverse().forEach(function(x){
      var it=el("div","item"),top=el("div","top");
      top.appendChild(el("span","",tipo==="rec"?"Nº "+num(x.num)+" · "+x.cli:x.desc));
      top.appendChild(el("span",tipo==="rec"?"in":"out",kz(x.val)));
      it.appendChild(top);
      it.appendChild(el("div","sub",x.dat+(tipo==="rec"?" · "+x.srv:"")));
      var a=el("div","acts");
      if(tipo==="rec"){var b=el("button","sm","Ver recibo");b.type="button";b.addEventListener("click",function(){ver(x)});a.appendChild(b)}
      var d=el("button","sm alt","Apagar");d.type="button";d.addEventListener("click",function(){apagar(tipo,x.id,d)});a.appendChild(d);
      it.appendChild(a);box.appendChild(it);
    });
  }
  function render(){
    var r=S.rec.reduce(function(a,x){return a+x.val},0),d=S.des.reduce(function(a,x){return a+x.val},0);
    $("s-rec").textContent=kz(r);$("s-des").textContent=kz(d);$("s-sal").textContent=kz(r-d);
    var m=$("mov");m.textContent="";
    var all=S.rec.map(function(x){return{id:x.id,t:x.cli+" (recibo)",v:x.val,in:1,dat:x.dat}}).concat(S.des.map(function(x){return{id:x.id,t:x.desc,v:x.val,in:0,dat:x.dat}}));
    all.sort(function(a,b){return b.id-a.id});
    if(!all.length)m.appendChild(el("p","empty","Comece por criar o seu primeiro recibo."));
    all.slice(0,5).forEach(function(x){
      var it=el("div","item"),top=el("div","top");
      top.appendChild(el("span","",x.t));
      top.appendChild(el("span",x.in?"in":"out",(x.in?"+ ":"− ")+kz(x.v)));
      it.appendChild(top);it.appendChild(el("div","sub",x.dat));m.appendChild(it);
    });
    lista($("l-rec"),S.rec,"rec");lista($("l-des"),S.des,"des");
  }

  $("addR").addEventListener("click",function(){
    var cli=$("cli").value.trim(),srv=$("srv").value.trim(),v=Number($("val").value);
    if(!cli||!srv||!(v>0)){$("m-rec").textContent="Preencha o cliente, o serviço e um valor maior que zero.";return}
    var r={id:Date.now(),num:S.n,cli:cli,srv:srv,val:v,pag:$("pag").value,dat:hoje()};
    S.rec.push(r);S.n++;save();
    $("cli").value="";$("srv").value="";$("val").value="";$("m-rec").textContent="Recibo guardado!";
    render();ver(r);
  });
  $("addD").addEventListener("click",function(){
    var desc=$("dd").value.trim(),v=Number($("dv").value);
    if(!desc||!(v>0)){$("m-des").textContent="Preencha a descrição e um valor maior que zero.";return}
    S.des.push({id:Date.now(),desc:desc,val:v,dat:hoje()});save();
    $("dd").value="";$("dv").value="";$("m-des").textContent="Gasto guardado!";render();
  });

  document.querySelectorAll("nav button").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b?"true":"false")});
      ["res","rec","des"].forEach(function(t){$("t-"+t).hidden=(t!==b.dataset.t)});
      window.scrollTo(0,0);
    });
  });
  render();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
